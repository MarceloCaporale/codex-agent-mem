[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-agent-mem"
version = "1.0.1"
description = "Local-first MCP memory for AI agents with scoped continuity packs, structured payloads, and closure checks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Marcelo Caporale" },
]
maintainers = [
  { name = "Marcelo Caporale" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "agent-memory",
  "ai-agents",
  "agent-continuity",
  "local-first",
  "sqlite",
  "structured-content",
  "context-packs",
  "mcp-memory",
  "ai-agent-memory",
  "token-efficiency",
  "context-compression",
  "agent-workflows",
  "codex",
  "claude-code",
  "gemini-cli",
  "qwen",
]
dependencies = [
  "fastapi>=0.111",
  "jinja2>=3.1",
  "pydantic>=2.8",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/MarceloCaporale/codex-agent-mem"
Repository = "https://github.com/MarceloCaporale/codex-agent-mem"
Issues = "https://github.com/MarceloCaporale/codex-agent-mem/issues"
"Author / X" = "https://x.com/MarceloCaporale"
"Visual AI Media" = "https://visualaimedia.com"
"Visual Systems Lab" = "https://visualsystemslab.com"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
codex-agent-mem-api = "codex_agent_mem.api:main"
codex-agent-mem-bootstrap-codex = "codex_agent_mem.bootstrap_codex:main"
codex-agent-mem-codex-notify = "codex_agent_mem.codex_notify:main"
codex-agent-mem-daemon = "codex_agent_mem.mcp_daemon:main"
codex-agent-mem-mcp = "codex_agent_mem.mcp_stdio:main"
codex-agent-mem-policy = "codex_agent_mem.policy_cli:main"
codex-agent-mem-refresh-context = "codex_agent_mem.refresh_context:main"
codex-agent-mem-snapshot = "codex_agent_mem.snapshot_cli:main"
codex-agent-mem-smoke = "codex_agent_mem.smoke:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_agent_mem = ["schema.sql", "templates/*.html", "static/*.css"]
