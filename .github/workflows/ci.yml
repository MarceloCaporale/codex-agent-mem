name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Repository hygiene
        run: python scripts/check_repo_hygiene.py --release-version v1.0.1

      - name: Install
        run: python -m pip install -e .[dev]

      - name: Lint
        run: ruff check --no-cache .

      - name: Compile
        run: python -m compileall src scripts tests

      - name: Test
        run: pytest -q

      - name: MCP contract smoke
        run: python scripts/mcp_contract_smoke.py --both
